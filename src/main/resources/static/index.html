<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inventario Pro | Gestión de Productos</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css?v=3">
</head>
<body>
    <header class="topbar">
        <div class="topbar-inner">
            <div class="brand">
                <div class="brand-icon" aria-hidden="true">
                    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"></path>
                        <polyline points="3.27 6.96 12 12.01 20.73 6.96"></polyline>
                        <line x1="12" y1="22.08" x2="12" y2="12"></line>
                    </svg>
                </div>
                <div>
                    <h1>Control de Inventario</h1>
                    <p>Catálogo de Productos y Categorías</p>
                </div>
            </div>
            <span class="currency-pill">Moneda: GTQ (Q)</span>
        </div>
    </header>

    <main class="container">
        <!-- Notificación dinámica -->
        <div id="mensajeGlobal" class="alert oculto" role="alert"></div>

        <div class="grid-layout">
            <!-- Panel Izquierdo: Formulario y Categorías -->
            <aside class="sidebar">
                <section class="card">
                    <div class="card-header">
                        <h2>Nuevo Producto</h2>
                        <span class="subtitle">Complete los datos obligatorios</span>
                    </div>

                    <form id="formProducto" novalidate>
                        <div class="form-group">
                            <label for="nombre">Nombre del Producto <span class="req">*</span></label>
                            <input type="text" id="nombre" placeholder="Ej. Monitor LED 24 pulgadas" autocomplete="off" required>
                        </div>

                        <div class="form-group">
                            <label for="categoriaId">Categoría <span class="req">*</span></label>
                            <div class="select-wrapper">
                                <select id="categoriaId" required>
                                    <option value="">Seleccione una categoría...</option>
                                </select>
                            </div>
                        </div>

                        <div class="form-row">
                            <div class="form-group">
                                <label for="precio">Precio (Q) <span class="req">*</span></label>
                                <input type="number" id="precio" step="0.01" min="0.01" placeholder="0.00" required>
                            </div>

                            <div class="form-group">
                                <label for="stock">Stock Inicial <span class="req">*</span></label>
                                <input type="number" id="stock" step="1" min="0" placeholder="0" required>
                            </div>
                        </div>

                        <button type="submit" class="btn btn-primary">
                            + Registrar Producto
                        </button>
                    </form>
                </section>

                <section class="card">
                    <div class="card-header">
                        <h3>Categorías Activas</h3>
                        <span class="subtitle">Solo eliminables sin productos</span>
                    </div>
                    <ul id="listaCategorias" class="category-list"></ul>
                </section>
            </aside>

            <!-- Panel Derecho: Filtros y Tabla/Tarjetas -->
            <section class="card main-panel">
                <div class="panel-top">
                    <div>
                        <h2>Listado de Productos</h2>
                        <span id="contadorProductos" class="subtitle">Cargando inventario...</span>
                    </div>
                </div>

                <div class="filters">
                    <div class="search-box">
                        <svg class="search-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <circle cx="11" cy="11" r="8"></circle>
                            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                        </svg>
                        <input type="text" id="filtroNombre" placeholder="Buscar producto por nombre...">
                    </div>

                    <div class="select-wrapper">
                        <select id="filtroCategoria">
                            <option value="">Todas las categorías</option>
                        </select>
                    </div>
                </div>

                <div class="table-container">
                    <table class="responsive-table">
                        <thead>
                            <tr>
                                <th>Producto</th>
                                <th>Categoría</th>
                                <th>Precio</th>
                                <th>Stock</th>
                                <th>Estado</th>
                            </tr>
                        </thead>
                        <tbody id="tablaProductos">
                            <!-- Contenido dinámico -->
                        </tbody>
                    </table>
                </div>
            </section>
        </div>
    </main>

    <script src="app.js?v=3"></script>
</body>
</html>
